<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="description" content="Organize baterias de kart e sorteie karts sem complicação.">
  <title>Kartou! — Sorteio de baterias</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="Assets/image/Kartou! - whitelogo.png">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Kartou! início"><img class="brand-logo" src="Assets/image/Kartou! - whitelogo.png" alt=""></a>
      <div class="topbar-right"><span class="local-badge" id="accountBadge" hidden></span><button class="text-button" id="resetDemo" title="Apagar os dados desta conta" hidden>↻ <span>Apagar dados</span></button><button class="text-button" id="signOut" hidden>Sair</button></div>
    </header>
    <main id="main" class="main-content"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><form method="dialog" class="modal-card" id="modalForm"><button class="modal-close" type="button" data-modal-close aria-label="Fechar">×</button><div id="modalContent"></div></form></dialog>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>

</html>
